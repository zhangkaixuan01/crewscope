<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5faf6" />
    <meta name="description" content="CrewScope 团队协作式 AI 工作执行平台" />
    <link rel="icon" href="/src/design/crewscope-mark.svg" type="image/svg+xml" />
    <!-- Apply persisted device preferences before Vue/CSS paints to avoid a light-theme flash. -->
    <script>
      (() => {
        const read = (key, allowed, fallback) => {
          try {
            const parsed = JSON.parse(window.localStorage.getItem(key) || 'null')
            return parsed && parsed.version === 1 && allowed.includes(parsed.value) ? parsed.value : fallback
          } catch {
            return fallback
          }
        }
        const themePreference = read('cs.pref.device.theme.v1', ['system', 'light', 'dark'], 'system')
        const dark = themePreference === 'dark' || (themePreference === 'system' && window.matchMedia?.('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.density = read('cs.pref.device.density.v1', ['comfortable', 'compact'], 'comfortable')
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#111814' : '#f5faf6')
      })()
    </script>
    <title>CrewScope</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
