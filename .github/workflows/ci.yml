name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Prepare Docker verification runtime
        run: |
          docker info
          docker pull maven@sha256:29a1658b1f3078e07c2b17f7b519b45eb47f65d9628e887eac45a8c5c8f939d4
      - name: Prepare Maven Wrapper
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --batch-mode --no-transfer-progress --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    # Visual baselines are authored on macOS; keep one stable rasterization environment in CI.
    runs-on: macos-14
    defaults:
      run:
        working-directory: crewscope-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crewscope-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests and coverage
        run: pnpm test:coverage
      - name: Build application
        run: pnpm build
      - name: Build component workbench
        run: pnpm story:build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run browser and visual tests
        run: pnpm test:e2e
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-evidence
          path: |
            crewscope-web/coverage/
            crewscope-web/dist/
            crewscope-web/.histoire/dist/
            crewscope-web/playwright-report/
            crewscope-web/test-results/
          if-no-files-found: warn
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check pushed patch integrity
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BEFORE_SHA" "$HEAD_SHA"
      - name: Check pull request patch integrity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

  release-gate:
    if: always()
    needs: [backend, frontend, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all M0 verification jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
