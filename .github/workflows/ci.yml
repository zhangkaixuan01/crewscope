name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer commit supersedes an in-flight check for the same branch or PR.
  group: crewscope-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      images: ${{ steps.filter.outputs.images }}
      quality: ${{ steps.filter.outputs.quality }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
            head="$HEAD_SHA"
          fi
          files="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1"; }
          backend=false
          frontend=false
          dependencies=false
          images=false
          if has '^(pom\.xml$|crewscope-(domain|application|agentscope|infrastructure|integration|server)/|deploy/team-beta/backend\.Dockerfile$|config/maven-dependency-analyze\.allowlist$|scripts/check-maven-dependency-report\.mjs$|scripts/check-test-report-zero-skips\.mjs$)'; then backend=true; fi
          if has '^crewscope-web/'; then frontend=true; fi
          if has '(^pom\.xml$|/pom\.xml$|(^|/)package\.json$|(^|/)pnpm-lock\.yaml$|(^|/)osv-scanner\.toml$|deploy/team-beta/|\.github/workflows/)'; then dependencies=true; fi
          if has '^(pom\.xml$|crewscope-(domain|application|agentscope|infrastructure|integration|server)/|crewscope-web/|deploy/team-beta/)'; then images=true; fi
          # Documentation and scripts still run the quality contract, while unrelated build
          # surfaces remain skipped. An empty diff is only possible for a manually re-run job.
          quality=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

  backend:
    if: needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare Docker verification runtime
        run: |
          docker info
          docker pull maven@sha256:29a1658b1f3078e07c2b17f7b519b45eb47f65d9628e887eac45a8c5c8f939d4
      - name: Prepare Maven Wrapper
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --batch-mode --no-transfer-progress --version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Verify backend
        # No `clean` (the CI runner starts from a fresh checkout, so there is nothing to clean)
        # and `-T 1C` so the container-free modules build in parallel with infrastructure; the
        # infrastructure -> server dependency chain still serializes the two heavy modules.
        run: ./mvnw --batch-mode --no-transfer-progress -T 1C verify
      - name: Verify Spring configuration metadata
        run: |
          test -s crewscope-infrastructure/target/classes/META-INF/spring-configuration-metadata.json
          test -s crewscope-server/target/classes/META-INF/spring-configuration-metadata.json
      - name: Analyze Maven dependency contract
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -DskipTests dependency:analyze -DfailOnWarning=false 2>&1 | tee dependency-analyze.log
          node scripts/check-maven-dependency-report.mjs dependency-analyze.log
      - name: Enforce zero skipped backend tests
        run: node scripts/check-test-report-zero-skips.mjs
      - name: Compile frozen M4 Judge Pack
        run: |
          evaluation_workspace="$(mktemp -d)"
          trap 'rm -rf "$evaluation_workspace"' EXIT
          node evaluation/m4/coding-v1/scripts/evaluate.mjs materialize --output "$evaluation_workspace"
          mkdir -p "$evaluation_workspace/src/test/java/io/crewscope/evaluation"
          cp evaluation/m4/coding-v1/judge-tests/*/*.java "$evaluation_workspace/src/test/java/io/crewscope/evaluation/"
          ./mvnw --batch-mode --no-transfer-progress \
            --file "$evaluation_workspace/pom.xml" \
            -DskipTests test
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            dependency-analyze.log
          if-no-files-found: warn
          retention-days: 14

  frontend:
    if: needs.changes.outputs.frontend == 'true'
    needs: changes
    name: Frontend unit, build and workbench
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crewscope-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crewscope-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests and coverage
        run: pnpm test:coverage
      - name: Build application
        run: pnpm build
      - name: Check M9-Q01 bundle budget
        run: node ../scripts/check-web-bundle-budget.mjs
      - name: Build component workbench
        run: pnpm story:build
      - name: Upload frontend build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-evidence
          path: |
            crewscope-web/coverage/
            crewscope-web/dist/
            crewscope-web/.histoire/dist/
          if-no-files-found: warn
          retention-days: 14

  frontend_e2e:
    if: needs.changes.outputs.frontend == 'true'
    needs: changes
    name: Frontend browser and visual tests
    # Visual baselines are authored on macOS; keep one stable rasterization environment in CI.
    # Split from the unit/build job so the two run in parallel instead of serially on one
    # low-core macOS runner — the wall clock becomes max(unit+build, e2e) instead of a sum.
    runs-on: macos-14
    defaults:
      run:
        working-directory: crewscope-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crewscope-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Build application bundle
        # The m9b-a05/f05/f02 mock worlds serve the SPA document from dist/ through
        # page.route (their fixtures resolve('dist')), so the browser matrix needs the
        # production bundle present or every goto to those origins aborts with
        # ERR_FAILED. Only the bundle is rebuilt here: the unit/build job already ran
        # the full vue-tsc type check, and re-checking the whole app on a 3-vCPU
        # runner would buy nothing.
        run: pnpm exec vite build
      - name: Run browser and visual tests
        run: pnpm test:e2e
      - name: Upload frontend e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-evidence
          path: |
            crewscope-web/playwright-report/
            crewscope-web/test-results/
          if-no-files-found: warn
          retention-days: 14

  quality:
    if: needs.changes.outputs.quality == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The recovery fingerprint records the exact pnpm runtime used by Team Beta.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crewscope-web/pnpm-lock.yaml
      - name: Install web quality dependencies
        working-directory: crewscope-web
        run: pnpm install --frozen-lockfile
      - name: Check pushed patch integrity
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BEFORE_SHA" "$HEAD_SHA"
      - name: Check pull request patch integrity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
      - name: Check OpenAPI and state-machine contracts
        run: node scripts/check-openapi-drift.mjs
      - name: Validate Team Beta deployment contract
        run: node scripts/check-team-beta-deployment.mjs
      - name: Validate environment and Secret configuration contract
        run: node scripts/check-config-contract.mjs
      - name: Validate Team Beta backup and recovery contract
        run: node scripts/check-team-beta-recovery.mjs
      - name: Check Web public projections for sensitive fields
        run: node scripts/check-web-sensitive-fields.mjs
      - name: Check Design System v2 tokens
        run: node scripts/check-design-tokens.mjs
      - name: Check front-end module boundaries (layering, cycles, orphans)
        run: node scripts/check-front-boundaries.mjs
      - name: Check M9-Q01 experience regression baseline
        run: node scripts/check-m9-q01.mjs
      - name: Check M9-Q01 empty-state actions
        run: node scripts/check-empty-states.mjs
      - name: Check M9-Q01 route metadata
        run: node scripts/check-route-metadata.mjs
      - name: Check M9-Q01 disabled-control explanations
        run: node scripts/check-disabled-reasons.mjs
      - name: Check StatePanel error recovery contract
        run: node scripts/check-state-panel-recovery.mjs
      - name: Check M9-Q01 cursor-pagination filtering
        run: node scripts/check-web-pagination.mjs
      - name: Check M9-Q01 dialog focus contracts
        run: node scripts/check-dialog-focus.mjs
      - name: Check M9-Q01 configuration form text tokens
        run: node scripts/check-config-form-tokens.mjs
      - name: Check Web enum labels are localised
        run: node scripts/check-web-enum-labels.mjs
      - name: Validate M7 release contract
        run: node scripts/check-m7-release-contract.mjs
      - name: Validate frozen M4 coding evaluation suite
        run: node evaluation/m4/coding-v1/scripts/evaluate.mjs validate
      - name: Validate M4-Q03 benchmark protocol
        run: |
          node evaluation/m4/coding-q03/scripts/benchmark.mjs validate
          node --test evaluation/m4/coding-q03/scripts/benchmark.test.mjs
          node --test evaluation/m4/coding-q03/scripts/benchmark.integration.test.mjs
      - name: Validate M5-Q03 Reviewer benchmark protocol
        run: |
          node evaluation/m5/reviewer-q03/scripts/benchmark.mjs validate
          node --test evaluation/m5/reviewer-q03/scripts/benchmark.test.mjs
      - name: Check Java module boundaries
        run: node scripts/check-module-boundaries.mjs
      - name: Check dependency and configuration contract
        run: node scripts/check-dependency-contract.mjs
      - name: Check release workflow contract
        run: node scripts/check-release-contract.mjs
      - name: Check web quality contract
        working-directory: crewscope-web
        run: pnpm check:quality

  dependency_security_osv:
    if: needs.changes.outputs.dependencies == 'true'
    needs: changes
    name: Audit Maven and web dependency manifests
    # The pinned reusable workflow declares these permissions even when SARIF upload is disabled.
    # A reusable workflow cannot elevate the caller token, so grant its minimum declared scope here.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false

  dependency_security_web:
    if: needs.changes.outputs.dependencies == 'true'
    needs: changes
    name: Audit production web dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit production web dependencies
        working-directory: crewscope-web
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

  image_security:
    if: needs.changes.outputs.images == 'true'
    needs: changes
    name: Build and scan Team Beta images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build --file deploy/team-beta/backend.Dockerfile --tag crewscope-backend:ci .
          docker build --file deploy/team-beta/web.Dockerfile --tag crewscope-web:ci .
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crewscope-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Scan Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crewscope-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  critical_path:
    # M13h first-run smoke: one throwaway production Compose stack (quickstart-generated,
    # credential-free) and one brand-new account walking the whole acquisition path through
    # the real UI — register, onboard the team, open the conversation page, exchange the
    # first message. Both M13-era release-level bricks (503 registration_unavailable, 422
    # modelProvider.contentHash) shipped while every mock e2e was green; only a real stack
    # guards this path. Agent reply asserts the designed failure boundary (visible, terminal,
    # nothing swallowed) because the stack intentionally carries no model credentials.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true'
    needs: changes
    name: Critical path smoke (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CREWSCOPE_QUICKSTART_PROJECT_NAME: crewscope-critical-path
      CREWSCOPE_QUICKSTART_RUNTIME_ROOT: /tmp/crewscope-critical-path
      CREWSCOPE_WEB_PORT: "18090"
      CREWSCOPE_REGISTRATION_MODE: OPEN
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crewscope-web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: crewscope-web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: crewscope-web
        run: pnpm exec playwright install chromium
      - name: Build and start the throwaway stack
        run: ./deploy/team-beta/quickstart.sh up
      - name: Run the first-run smoke
        working-directory: crewscope-web
        env:
          CREWSCOPE_REAL_BASE_URL: http://127.0.0.1:18090
        run: pnpm exec playwright test --config playwright.critical-path.config.ts
      - name: Dump stack logs
        if: failure()
        run: ./deploy/team-beta/quickstart.sh compose logs --no-color --tail 300 api postgres
      - name: Teardown the throwaway stack
        if: always()
        run: ./deploy/team-beta/quickstart.sh reset
      - name: Upload critical-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-path-evidence
          path: |
            crewscope-web/playwright-report-critical-path/
            crewscope-web/test-results-critical-path/
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    if: always()
    needs: [changes, backend, frontend, frontend_e2e, quality, critical_path, dependency_security_osv, dependency_security_web, image_security]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the M7 release gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend_e2e.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCY_OSV_RESULT: ${{ needs.dependency_security_osv.result }}
          DEPENDENCY_WEB_RESULT: ${{ needs.dependency_security_web.result }}
          IMAGE_SECURITY_RESULT: ${{ needs.image_security.result }}
          CRITICAL_PATH_RESULT: ${{ needs.critical_path.result }}
          BACKEND_NEEDED: ${{ needs.changes.outputs.backend }}
          FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
          DEPENDENCIES_NEEDED: ${{ needs.changes.outputs.dependencies }}
          IMAGES_NEEDED: ${{ needs.changes.outputs.images }}
          QUALITY_NEEDED: ${{ needs.changes.outputs.quality }}
          CRITICAL_PATH_NEEDED: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' }}
        run: |
          test "$CHANGES_RESULT" = "success"
          check_result() {
            needed="$1"
            result="$2"
            if [ "$needed" = "true" ]; then
              test "$result" = "success"
            else
              test "$result" = "success" || test "$result" = "skipped"
            fi
          }
          check_result "$BACKEND_NEEDED" "$BACKEND_RESULT"
          check_result "$FRONTEND_NEEDED" "$FRONTEND_RESULT"
          check_result "$FRONTEND_NEEDED" "$FRONTEND_E2E_RESULT"
          check_result "$QUALITY_NEEDED" "$QUALITY_RESULT"
          check_result "$CRITICAL_PATH_NEEDED" "$CRITICAL_PATH_RESULT"
          check_result "$DEPENDENCIES_NEEDED" "$DEPENDENCY_OSV_RESULT"
          check_result "$DEPENDENCIES_NEEDED" "$DEPENDENCY_WEB_RESULT"
          check_result "$IMAGES_NEEDED" "$IMAGE_SECURITY_RESULT"
