spring:
  autoconfigure:
    # CrewScope owns conditional Redis browser-session assembly; Boot's unconditional starter
    # auto-configuration would otherwise attach Session state to bootstrap and worker processes.
    exclude:
      - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  application:
    name: crewscope-server
  codec:
    # Bounds JSON/form buffering before controller-level field validation runs.
    max-in-memory-size: ${CREWSCOPE_HTTP_MAX_IN_MEMORY_SIZE:256KB}
  datasource:
    # currentSchema makes JDBC and native queries use the owned schema while retaining public for extensions.
    url: ${CREWSCOPE_DB_URL:jdbc:postgresql://localhost:5432/crewscope?currentSchema=crewscope,public}
    username: ${CREWSCOPE_DB_USERNAME:crewscope}
    password: ${CREWSCOPE_DB_PASSWORD:crewscope}
  flyway:
    enabled: true
    schemas: crewscope
    create-schemas: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: crewscope
  threads:
    virtual:
      enabled: false
  reactor:
    # Restore the request logging context across asynchronous Reactor operators.
    context-propagation: auto
  data:
    redis:
      # Browser Session and Agent state share the deployment Redis service but use disjoint keys.
      # Team Beta supplies the URL through configtree so credentials never enter the environment.
      url: ${crewscope.runtime.redis.url:${CREWSCOPE_REDIS_URL:redis://localhost:6379}}
  session:
    timeout: ${crewscope.security.session.ttl}
    data:
      redis:
        namespace: ${crewscope.security.session.namespace}
        repository-type: indexed
        save-mode: on-set-attribute

# AgentScope provider starters create the Spring Model used by CrewScope's stable
# `crewscope-primary` slot. Keep the provider empty for API-only development.
agentscope:
  model:
    provider: ${AGENTSCOPE_MODEL_PROVIDER:}
  openai:
    enabled: ${AGENTSCOPE_OPENAI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model-name: ${AGENTSCOPE_OPENAI_MODEL_NAME:gpt-4.1-mini}
    base-url: ${AGENTSCOPE_OPENAI_BASE_URL:}
    endpoint-path: ${AGENTSCOPE_OPENAI_ENDPOINT_PATH:}
    stream: ${AGENTSCOPE_OPENAI_STREAM:true}

server:
  port: ${CREWSCOPE_SERVER_PORT:8080}
  shutdown: graceful
  reactive:
    session:
      timeout: ${crewscope.security.session.ttl}
      cookie:
        name: CREWSCOPE_SESSION
        http-only: true
        path: /
        same-site: lax
        # M7-I08 forces this to true for every HTTPS production deployment.
        secure: ${CREWSCOPE_SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    configprops:
      show-values: never
    env:
      show-values: never
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${CREWSCOPE_TRACE_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      # M0 creates and propagates traces without requiring an external collector.
      otlp:
        enabled: ${CREWSCOPE_OTLP_TRACING_ENABLED:false}

logging:
  structured:
    format:
      console: ${CREWSCOPE_LOG_FORMAT:logstash}
    json:
      # Loaded before the ApplicationContext so every structured String member is filtered.
      customizer: io.crewscope.server.observability.SafeStructuredLoggingJsonCustomizer
      context:
        include: true
      stacktrace:
        max-length: 8192
        max-throwable-depth: 20

crewscope:
  provider:
    lark:
      # Production is pinned to the Feishu OpenAPI origin; loopback HTTP is test-only.
      base-uri: ${CREWSCOPE_LARK_BASE_URI:https://open.feishu.cn}
      connect-timeout: ${CREWSCOPE_LARK_CONNECT_TIMEOUT:5s}
      request-timeout: ${CREWSCOPE_LARK_REQUEST_TIMEOUT:15s}
      credential-handle-ttl: ${CREWSCOPE_LARK_CREDENTIAL_HANDLE_TTL:30s}
      member-confirmation-window: ${CREWSCOPE_LARK_MEMBER_CONFIRMATION_WINDOW:10m}
      token-expiry-safety-margin: ${CREWSCOPE_LARK_TOKEN_EXPIRY_SAFETY_MARGIN:60s}
      maximum-cached-tokens: ${CREWSCOPE_LARK_MAXIMUM_CACHED_TOKENS:1024}
      maximum-response-bytes: ${CREWSCOPE_LARK_MAXIMUM_RESPONSE_BYTES:1048576}
      allow-loopback-http: ${CREWSCOPE_LARK_ALLOW_LOOPBACK_HTTP:false}
    github:
      # Production uses GitHub's HTTPS API. Loopback HTTP is an explicit test-only escape hatch.
      api-base-uri: ${CREWSCOPE_GITHUB_API_BASE_URI:https://api.github.com}
      web-base-uri: ${CREWSCOPE_GITHUB_WEB_BASE_URI:https://github.com}
      connect-timeout: ${CREWSCOPE_GITHUB_CONNECT_TIMEOUT:5s}
      request-timeout: ${CREWSCOPE_GITHUB_REQUEST_TIMEOUT:15s}
      catalog-ttl: ${CREWSCOPE_GITHUB_CATALOG_TTL:5m}
      credential-handle-ttl: ${CREWSCOPE_GITHUB_CREDENTIAL_HANDLE_TTL:30s}
      allow-loopback-http: ${CREWSCOPE_GITHUB_ALLOW_LOOPBACK_HTTP:false}
      # Git Remote stays credential-free; Mirror and AskPass paths are platform-owned roots.
      git-base-uri: ${CREWSCOPE_GITHUB_GIT_BASE_URI:https://github.com}
      mirror-root: ${CREWSCOPE_GITHUB_MIRROR_ROOT:./var/crewscope/github-mirrors}
      ask-pass-root: ${CREWSCOPE_GITHUB_ASK_PASS_ROOT:./var/crewscope/github-credentials}
      required-owner: ${CREWSCOPE_GITHUB_REQUIRED_OWNER:${user.name}}
      # M5-A06 will persist per-Connection policy; I11 uses this fail-closed bootstrap policy.
      repository-allowlist: ${CREWSCOPE_GITHUB_REPOSITORY_ALLOWLIST:}
      allowed-owner-logins: ${CREWSCOPE_GITHUB_ALLOWED_OWNER_LOGINS:}
      allow-private-repositories: ${CREWSCOPE_GITHUB_ALLOW_PRIVATE_REPOSITORIES:true}
      allow-internal-repositories: ${CREWSCOPE_GITHUB_ALLOW_INTERNAL_REPOSITORIES:true}
      # USER OAuth connections require the GitHub `repo` scope. Broad access is an explicit
      # deployment decision and remains disabled unless the environment opts in.
      allow-broad-user-oauth: ${CREWSCOPE_GITHUB_ALLOW_BROAD_USER_OAUTH:false}
  action:
    worker:
      enabled: ${CREWSCOPE_ACTION_WORKER_ENABLED:true}
      worker-id: ${CREWSCOPE_ACTION_WORKER_ID:action-worker-local}
      poll-interval: ${CREWSCOPE_ACTION_WORKER_POLL_INTERVAL:1s}
      lease-duration: ${CREWSCOPE_ACTION_WORKER_LEASE_DURATION:2m}
      retry-delay: ${CREWSCOPE_ACTION_WORKER_RETRY_DELAY:15s}
      batch-size: ${CREWSCOPE_ACTION_WORKER_BATCH_SIZE:10}
    reconciliation:
      enabled: ${CREWSCOPE_ACTION_RECONCILIATION_ENABLED:true}
      startup-enabled: ${CREWSCOPE_ACTION_RECONCILIATION_STARTUP_ENABLED:true}
      worker-id: ${CREWSCOPE_ACTION_RECONCILIATION_WORKER_ID:action-reconciler-local}
      poll-interval: ${CREWSCOPE_ACTION_RECONCILIATION_POLL_INTERVAL:5s}
      lease-duration: ${CREWSCOPE_ACTION_RECONCILIATION_LEASE_DURATION:2m}
      retry-delay: ${CREWSCOPE_ACTION_RECONCILIATION_RETRY_DELAY:30s}
      maximum-unknown-age: ${CREWSCOPE_ACTION_RECONCILIATION_MAXIMUM_UNKNOWN_AGE:1h}
      maximum-attempts: ${CREWSCOPE_ACTION_RECONCILIATION_MAXIMUM_ATTEMPTS:5}
      batch-size: ${CREWSCOPE_ACTION_RECONCILIATION_BATCH_SIZE:10}
  notification:
    worker:
      enabled: ${CREWSCOPE_NOTIFICATION_WORKER_ENABLED:true}
      reconciliation-enabled: ${CREWSCOPE_NOTIFICATION_RECONCILIATION_ENABLED:true}
      redelivery-enabled: ${CREWSCOPE_NOTIFICATION_REDELIVERY_ENABLED:true}
      worker-id: ${CREWSCOPE_NOTIFICATION_WORKER_ID:notification-worker-local}
      reconciliation-worker-id: ${CREWSCOPE_NOTIFICATION_RECONCILIATION_WORKER_ID:notification-reconciler-local}
      redelivery-worker-id: ${CREWSCOPE_NOTIFICATION_REDELIVERY_WORKER_ID:notification-redelivery-local}
      poll-interval: ${CREWSCOPE_NOTIFICATION_WORKER_POLL_INTERVAL:1s}
      reconciliation-poll-interval: ${CREWSCOPE_NOTIFICATION_RECONCILIATION_POLL_INTERVAL:5s}
      redelivery-poll-interval: ${CREWSCOPE_NOTIFICATION_REDELIVERY_POLL_INTERVAL:2s}
      lease-duration: ${CREWSCOPE_NOTIFICATION_LEASE_DURATION:2m}
      credential-ttl: ${CREWSCOPE_NOTIFICATION_CREDENTIAL_TTL:30s}
      retry-delay: ${CREWSCOPE_NOTIFICATION_RETRY_DELAY:15s}
      maximum-retry-delay: ${CREWSCOPE_NOTIFICATION_MAXIMUM_RETRY_DELAY:15m}
      reconciliation-retry-delay: ${CREWSCOPE_NOTIFICATION_RECONCILIATION_RETRY_DELAY:30s}
      maximum-attempts: ${CREWSCOPE_NOTIFICATION_MAXIMUM_ATTEMPTS:5}
      reconciliation-maximum-attempts: ${CREWSCOPE_NOTIFICATION_RECONCILIATION_MAXIMUM_ATTEMPTS:5}
      batch-size: ${CREWSCOPE_NOTIFICATION_BATCH_SIZE:10}
  coding:
    execution:
      # Attempt-scoped immutable WorkspacePolicy ceilings and local delivery retention.
      retention: ${CREWSCOPE_CODING_WORKSPACE_RETENTION:7d}
      cpu-count: ${CREWSCOPE_CODING_WORKSPACE_CPU_COUNT:2}
      memory-mib: ${CREWSCOPE_CODING_WORKSPACE_MEMORY_MIB:2048}
      pids: ${CREWSCOPE_CODING_WORKSPACE_PIDS:256}
      max-command-duration-seconds: ${CREWSCOPE_CODING_WORKSPACE_MAX_COMMAND_SECONDS:900}
      max-command-output-bytes: ${CREWSCOPE_CODING_WORKSPACE_MAX_COMMAND_OUTPUT_BYTES:1048576}
      max-command-calls: ${CREWSCOPE_CODING_WORKSPACE_MAX_COMMAND_CALLS:32}
      max-changed-files: ${CREWSCOPE_CODING_WORKSPACE_MAX_CHANGED_FILES:100}
      max-single-file-bytes: ${CREWSCOPE_CODING_WORKSPACE_MAX_SINGLE_FILE_BYTES:1048576}
      max-write-operations: ${CREWSCOPE_CODING_WORKSPACE_MAX_WRITE_OPERATIONS:32}
      max-written-bytes: ${CREWSCOPE_CODING_WORKSPACE_MAX_WRITTEN_BYTES:16777216}
      max-diff-bytes: ${CREWSCOPE_CODING_WORKSPACE_MAX_DIFF_BYTES:8388608}
      max-test-repair-rounds: ${CREWSCOPE_CODING_WORKSPACE_MAX_TEST_REPAIR_ROUNDS:2}
    artifact:
      # Full Coding evidence is Restricted; APIs must page through this bounded Range window.
      retention: ${CREWSCOPE_CODING_ARTIFACT_RETENTION:30d}
      maximum-artifact-bytes: ${CREWSCOPE_CODING_ARTIFACT_MAXIMUM_BYTES:67108864}
      maximum-range-bytes: ${CREWSCOPE_CODING_ARTIFACT_MAXIMUM_RANGE_BYTES:1048576}
      maximum-concurrent-reads: ${CREWSCOPE_CODING_ARTIFACT_MAXIMUM_CONCURRENT_READS:16}
    git:
      # Host Git runs with this isolated HOME and fails closed on unsafe process budgets.
      command-home: ${CREWSCOPE_CODING_GIT_COMMAND_HOME:./var/crewscope/git-home}
      timeout: ${CREWSCOPE_CODING_GIT_TIMEOUT:30s}
      maximum-output-bytes: ${CREWSCOPE_CODING_GIT_MAXIMUM_OUTPUT_BYTES:1048576}
    repository:
      # Only <managed-root>/<repository-key>.git bare repositories owned by this Worker are trusted.
      managed-root: ${CREWSCOPE_CODING_REPOSITORY_MANAGED_ROOT:./var/crewscope/repositories}
      required-owner: ${CREWSCOPE_CODING_REPOSITORY_REQUIRED_OWNER:${user.name}}
    worktree:
      # All roots must be pre-created and owned by the configured Worker operating-system identity.
      root: ${CREWSCOPE_CODING_WORKTREE_ROOT:./var/crewscope/worktrees}
      lock-root: ${CREWSCOPE_CODING_WORKTREE_LOCK_ROOT:./var/crewscope/worktree-locks}
      required-owner: ${CREWSCOPE_CODING_WORKTREE_REQUIRED_OWNER:${user.name}}
    sandbox:
      # Image and hard resource ceilings come from the immutable BuildProfile and WorkspacePolicy.
      workspace-root: ${CREWSCOPE_CODING_SANDBOX_WORKSPACE_ROOT:/workspace}
      repository-mount: ${CREWSCOPE_CODING_SANDBOX_REPOSITORY_MOUNT:repository}
      docker-command-timeout: ${CREWSCOPE_CODING_SANDBOX_DOCKER_COMMAND_TIMEOUT:30s}
      pause-stop-timeout: ${CREWSCOPE_CODING_SANDBOX_PAUSE_STOP_TIMEOUT:1s}
      pause-mode: ${CREWSCOPE_CODING_SANDBOX_PAUSE_MODE:STOP}
      # A verified immutable Maven snapshot is mounted read-only for offline benchmark execution.
      dependency-cache-root: ${CREWSCOPE_CODING_SANDBOX_DEPENDENCY_CACHE_ROOT:}
      dependency-cache-mount: ${CREWSCOPE_CODING_SANDBOX_DEPENDENCY_CACHE_MOUNT:/maven-cache}
    recovery:
      # Startup reconciliation completes before this Worker accepts new Task claims.
      recovery-batch-size: ${CREWSCOPE_CODING_RECOVERY_BATCH_SIZE:100}
      retention-batch-size: ${CREWSCOPE_CODING_RETENTION_BATCH_SIZE:100}
      artifact-purge-batch-size: ${CREWSCOPE_CODING_ARTIFACT_PURGE_BATCH_SIZE:100}
    evaluation:
      # Hidden Judge sources are opt-in and restricted to one dedicated benchmark repository.
      judge-tests-root: ${CREWSCOPE_CODING_EVALUATION_JUDGE_TESTS_ROOT:}
      repository-key: ${CREWSCOPE_CODING_EVALUATION_JUDGE_REPOSITORY_KEY:coding-evaluation}
    inspection:
      # Agent-visible repository reads stay below both these bounds and WorkspacePolicy ceilings.
      max-page-size: ${CREWSCOPE_CODING_INSPECTION_MAX_PAGE_SIZE:200}
      max-read-lines: ${CREWSCOPE_CODING_INSPECTION_MAX_READ_LINES:500}
      max-tree-depth: ${CREWSCOPE_CODING_INSPECTION_MAX_TREE_DEPTH:6}
      max-backend-operations: ${CREWSCOPE_CODING_INSPECTION_MAX_BACKEND_OPERATIONS:64}
      max-pattern-length: ${CREWSCOPE_CODING_INSPECTION_MAX_PATTERN_LENGTH:256}
      max-result-bytes: ${CREWSCOPE_CODING_INSPECTION_MAX_RESULT_BYTES:65536}
    filesystem:
      # Parser ceilings can only narrow the WorkspaceOperationBudget carried by the Task.
      max-tool-content-bytes: ${CREWSCOPE_CODING_FILESYSTEM_MAX_TOOL_CONTENT_BYTES:1048576}
      max-patch-hunks: ${CREWSCOPE_CODING_FILESYSTEM_MAX_PATCH_HUNKS:200}
    command:
      # Complete bounded logs enter ArtifactStore; only this UTF-8 prefix is returned to the Agent.
      max-tool-result-bytes: ${CREWSCOPE_CODING_COMMAND_MAX_TOOL_RESULT_BYTES:65536}
    diff:
      # WatchService only schedules Git-authoritative reconciliation; previews stay bounded.
      patch-preview-bytes: ${CREWSCOPE_CODING_DIFF_PATCH_PREVIEW_BYTES:65536}
      patch-preview-lines: ${CREWSCOPE_CODING_DIFF_PATCH_PREVIEW_LINES:1000}
      retained-events: ${CREWSCOPE_CODING_DIFF_RETAINED_EVENTS:512}
      maximum-replay-events: ${CREWSCOPE_CODING_DIFF_MAXIMUM_REPLAY_EVENTS:256}
      maximum-event-bytes: ${CREWSCOPE_CODING_DIFF_MAXIMUM_EVENT_BYTES:524288}
      debounce: ${CREWSCOPE_CODING_DIFF_DEBOUNCE:150ms}
      reconcile-interval: ${CREWSCOPE_CODING_DIFF_RECONCILE_INTERVAL:15s}
      # Override in shared/production deployments; it must remain stable across Worker restarts.
      cursor-secret: ${CREWSCOPE_CODING_DIFF_CURSOR_SECRET:crewscope-development-diff-cursor-key-v1}
  conversation-events:
    poll-interval: ${CREWSCOPE_CONVERSATION_EVENT_POLL_INTERVAL:500ms}
    batch-size: ${CREWSCOPE_CONVERSATION_EVENT_BATCH_SIZE:100}
  team-activity-realtime:
    # M6-I01 enables this after contributing the PostgreSQL TeamRealtimeEventStore Adapter.
    enabled: ${CREWSCOPE_TEAM_ACTIVITY_REALTIME_ENABLED:false}
    poll-interval: ${CREWSCOPE_TEAM_ACTIVITY_REALTIME_POLL_INTERVAL:500ms}
    heartbeat-interval: ${CREWSCOPE_TEAM_ACTIVITY_REALTIME_HEARTBEAT_INTERVAL:15s}
    batch-size: ${CREWSCOPE_TEAM_ACTIVITY_REALTIME_BATCH_SIZE:100}
    cursor-maximum-age: ${CREWSCOPE_TEAM_ACTIVITY_CURSOR_MAXIMUM_AGE:24h}
    cursor-future-skew: ${CREWSCOPE_TEAM_ACTIVITY_CURSOR_FUTURE_SKEW:30s}
    # No development fallback: enabled deployments provide current-key-id and Base64 keys.
    current-key-id: ${CREWSCOPE_TEAM_ACTIVITY_CURSOR_CURRENT_KEY_ID:v1}
    keys:
      v1: ${CREWSCOPE_TEAM_ACTIVITY_CURSOR_KEY_V1:}
  projection:
    supervisor:
      # Shared deployments set a stable, process-unique instance ID before enabling replay work.
      enabled: ${CREWSCOPE_PROJECTION_SUPERVISOR_ENABLED:false}
      instance-id: ${CREWSCOPE_PROJECTION_SUPERVISOR_INSTANCE_ID:projection-supervisor-local}
      poll-interval: ${CREWSCOPE_PROJECTION_SUPERVISOR_POLL_INTERVAL:2s}
      lease-duration: ${CREWSCOPE_PROJECTION_SUPERVISOR_LEASE_DURATION:30s}
      retention: ${CREWSCOPE_PROJECTION_RETENTION:7d}
      page-size: ${CREWSCOPE_PROJECTION_REPLAY_PAGE_SIZE:250}
      claim-limit: ${CREWSCOPE_PROJECTION_CLAIM_LIMIT:4}
  task-events:
    poll-interval: ${CREWSCOPE_TASK_EVENT_POLL_INTERVAL:500ms}
    batch-size: ${CREWSCOPE_TASK_EVENT_BATCH_SIZE:100}
    maximum-events-per-connection: ${CREWSCOPE_TASK_EVENT_MAXIMUM_EVENTS_PER_CONNECTION:10000}
  artifact:
    filesystem:
      root: ${CREWSCOPE_ARTIFACT_ROOT:./var/crewscope/artifacts}
  credential:
    encryption:
      # No development fallback: startup fails until the process receives an external key ring.
      current-key-id: ${CREWSCOPE_CREDENTIAL_CURRENT_KEY_ID:}
      keys: ${CREWSCOPE_CREDENTIAL_KEYS:}
  model:
    preflight:
      # Availability decisions are exact-version keyed and never outlive credential expiration.
      health-cache-ttl: ${CREWSCOPE_MODEL_PREFLIGHT_HEALTH_CACHE_TTL:30s}
      maximum-health-cache-entries: ${CREWSCOPE_MODEL_PREFLIGHT_MAXIMUM_HEALTH_CACHE_ENTRIES:1024}
      maximum-catalog-entries-per-provider: ${CREWSCOPE_MODEL_PREFLIGHT_MAXIMUM_CATALOG_ENTRIES_PER_PROVIDER:200}
    dynamic:
      # Dynamic models are bounded, version-keyed and never published as global Spring Model beans.
      cache-ttl: ${CREWSCOPE_MODEL_DYNAMIC_CACHE_TTL:5m}
      maximum-cache-entries: ${CREWSCOPE_MODEL_DYNAMIC_MAXIMUM_CACHE_ENTRIES:256}
      request-timeout: ${CREWSCOPE_MODEL_DYNAMIC_REQUEST_TIMEOUT:5m}
      retry-initial-backoff: ${CREWSCOPE_MODEL_DYNAMIC_RETRY_INITIAL_BACKOFF:2s}
      retry-maximum-backoff: ${CREWSCOPE_MODEL_DYNAMIC_RETRY_MAXIMUM_BACKOFF:30s}
    credential:
      # Handles contain coordinates only and revalidate the current secret revision on every use.
      # Startup rejects TTL above 10m, connect timeout above 1m and request timeout above 5m.
      handle-ttl: ${CREWSCOPE_MODEL_CREDENTIAL_HANDLE_TTL:30s}
      health-connect-timeout: ${CREWSCOPE_MODEL_HEALTH_CONNECT_TIMEOUT:3s}
      health-request-timeout: ${CREWSCOPE_MODEL_HEALTH_REQUEST_TIMEOUT:10s}
  outbox:
    # M0-E03 registers the durable AuditEvent projection consumer.
    enabled: ${CREWSCOPE_OUTBOX_ENABLED:true}
    worker-id: ${CREWSCOPE_OUTBOX_WORKER_ID:}
    poll-interval: ${CREWSCOPE_OUTBOX_POLL_INTERVAL:1000}
    batch-size: ${CREWSCOPE_OUTBOX_BATCH_SIZE:100}
    parallelism: ${CREWSCOPE_OUTBOX_PARALLELISM:4}
    claim-lease: ${CREWSCOPE_OUTBOX_CLAIM_LEASE:30s}
    max-attempts: ${CREWSCOPE_OUTBOX_MAX_ATTEMPTS:8}
    initial-backoff: ${CREWSCOPE_OUTBOX_INITIAL_BACKOFF:1s}
    maximum-backoff: ${CREWSCOPE_OUTBOX_MAXIMUM_BACKOFF:5m}
  operations-health:
    # Member views expose only these bounded component classifications and aggregate counts.
    projection:
      degraded-after: ${CREWSCOPE_OPERATIONS_PROJECTION_DEGRADED_AFTER:30s}
      attention-after: ${CREWSCOPE_OPERATIONS_PROJECTION_ATTENTION_AFTER:2m}
      degraded-backlog: ${CREWSCOPE_OPERATIONS_PROJECTION_DEGRADED_BACKLOG:1}
      attention-backlog: ${CREWSCOPE_OPERATIONS_PROJECTION_ATTENTION_BACKLOG:10}
    outbox:
      degraded-after: ${CREWSCOPE_OPERATIONS_OUTBOX_DEGRADED_AFTER:30s}
      attention-after: ${CREWSCOPE_OPERATIONS_OUTBOX_ATTENTION_AFTER:2m}
      degraded-backlog: ${CREWSCOPE_OPERATIONS_OUTBOX_DEGRADED_BACKLOG:10}
      attention-backlog: ${CREWSCOPE_OPERATIONS_OUTBOX_ATTENTION_BACKLOG:100}
    dead-letter:
      degraded-after: ${CREWSCOPE_OPERATIONS_DEAD_LETTER_DEGRADED_AFTER:1s}
      attention-after: ${CREWSCOPE_OPERATIONS_DEAD_LETTER_ATTENTION_AFTER:1s}
      degraded-backlog: ${CREWSCOPE_OPERATIONS_DEAD_LETTER_DEGRADED_BACKLOG:1}
      attention-backlog: ${CREWSCOPE_OPERATIONS_DEAD_LETTER_ATTENTION_BACKLOG:1}
    cursor:
      degraded-after: ${CREWSCOPE_OPERATIONS_CURSOR_DEGRADED_AFTER:1m}
      attention-after: ${CREWSCOPE_OPERATIONS_CURSOR_ATTENTION_AFTER:5m}
      degraded-backlog: ${CREWSCOPE_OPERATIONS_CURSOR_DEGRADED_BACKLOG:10}
      attention-backlog: ${CREWSCOPE_OPERATIONS_CURSOR_ATTENTION_BACKLOG:100}
    notification:
      degraded-after: ${CREWSCOPE_OPERATIONS_NOTIFICATION_DEGRADED_AFTER:1m}
      attention-after: ${CREWSCOPE_OPERATIONS_NOTIFICATION_ATTENTION_AFTER:5m}
      degraded-backlog: ${CREWSCOPE_OPERATIONS_NOTIFICATION_DEGRADED_BACKLOG:10}
      attention-backlog: ${CREWSCOPE_OPERATIONS_NOTIFICATION_ATTENTION_BACKLOG:100}
  security:
    # local uses CrewScope JSON login; bootstrap and oidc remain controlled compatibility modes.
    mode: ${CREWSCOPE_SECURITY_MODE:bootstrap}
    password:
      # ADR-025 selects 2 permits for 2C2G and 4 permits for 8C16G deployments.
      hash-permits: ${CREWSCOPE_PASSWORD_HASH_PERMITS:2}
    login-defense:
      # Team Beta enables this only in the API after external HMAC and trusted proxies are installed.
      enabled: ${CREWSCOPE_LOGIN_DEFENSE_ENABLED:false}
      environment: ${CREWSCOPE_LOGIN_DEFENSE_ENVIRONMENT:${CREWSCOPE_ENVIRONMENT:development}}
      hmac-key-id: ${CREWSCOPE_LOGIN_DEFENSE_HMAC_KEY_ID:v1}
      hmac-key: ${CREWSCOPE_LOGIN_DEFENSE_HMAC_KEY:}
      trusted-proxies: ${CREWSCOPE_LOGIN_DEFENSE_TRUSTED_PROXIES:}
    session:
      enabled: ${CREWSCOPE_BROWSER_SESSION_ENABLED:false}
      ttl: ${CREWSCOPE_SESSION_TTL:12h}
      maximum-sessions: ${CREWSCOPE_MAXIMUM_SESSIONS:5}
      namespace: ${CREWSCOPE_SESSION_NAMESPACE:crewscope:session}
    bootstrap:
      username: ${CREWSCOPE_BOOTSTRAP_USERNAME:crewscope}
      password: ${CREWSCOPE_BOOTSTRAP_PASSWORD:crewscope}
    monitoring:
      username: ${CREWSCOPE_MONITORING_USERNAME:crewscope-prometheus}
      password: ${CREWSCOPE_MONITORING_PASSWORD:crewscope-monitoring}
    operator-bootstrap:
      # Enable only in the migration-owning API process after the Bootstrap Organization exists.
      enabled: ${CREWSCOPE_OPERATOR_BOOTSTRAP_ENABLED:false}
      organization-id: ${CREWSCOPE_OPERATOR_BOOTSTRAP_ORGANIZATION_ID:}
      username: ${CREWSCOPE_OPERATOR_BOOTSTRAP_USERNAME:${CREWSCOPE_BOOTSTRAP_USERNAME:crewscope-monitor}}
      email: ${CREWSCOPE_OPERATOR_BOOTSTRAP_EMAIL:crewscope-monitor@crewscope.local}
      display-name: ${CREWSCOPE_OPERATOR_BOOTSTRAP_DISPLAY_NAME:CrewScope Operator}
    oidc:
      # One OIDC deployment registration is bound to one Organization tenant boundary.
      organization-id: ${CREWSCOPE_OIDC_ORGANIZATION_ID:}
    task-token:
      # Enable only with an externally supplied 256-bit-or-stronger Base64 HMAC key.
      enabled: ${CREWSCOPE_TASK_TOKEN_ENABLED:false}
      issuer: ${CREWSCOPE_TASK_TOKEN_ISSUER:crewscope}
      current-key-id: ${CREWSCOPE_TASK_TOKEN_CURRENT_KEY_ID:v1}
      keys:
        v1: ${CREWSCOPE_TASK_TOKEN_KEY_V1:}
  invitation:
    token:
      # M7-A05 enables invitation APIs only with an external 256-bit Base64 HMAC key.
      enabled: ${CREWSCOPE_INVITATION_TOKEN_ENABLED:false}
      hmac-key: ${CREWSCOPE_INVITATION_TOKEN_HMAC_KEY:}
  registration:
    mode: ${CREWSCOPE_REGISTRATION_MODE:OPEN}
    # Empty keeps the anonymous API closed until one deployment Organization is selected.
    organization-id: ${CREWSCOPE_REGISTRATION_ORGANIZATION_ID:}
  runtime:
    agentscope-version: 2.0.0
    execution-profile: ${CREWSCOPE_EXECUTION_PROFILE:all}
    observation:
      environment: ${CREWSCOPE_ENVIRONMENT:development}
      heartbeat-timeout: ${CREWSCOPE_RUNTIME_WORKER_HEARTBEAT_TIMEOUT:30s}
    registry:
      # all/worker profiles fail closed until these stable tenant identities are configured.
      organization-id: ${CREWSCOPE_RUNTIME_ORGANIZATION_ID:}
      actor-principal-id: ${CREWSCOPE_RUNTIME_ACTOR_PRINCIPAL_ID:}
      environment: ${CREWSCOPE_ENVIRONMENT:development}
      runtime-key: ${CREWSCOPE_RUNTIME_KEY:agentscope-java}
      display-name: ${CREWSCOPE_RUNTIME_DISPLAY_NAME:AgentScope Java}
      implementation-version: ${CREWSCOPE_RUNTIME_IMPLEMENTATION_VERSION:2.0.0}
      worker:
        # Must remain unchanged across restarts of the same logical Worker.
        stable-key: ${CREWSCOPE_RUNTIME_WORKER_STABLE_KEY:}
        max-concurrent-executions: ${CREWSCOPE_RUNTIME_WORKER_MAX_CONCURRENCY:4}
        heartbeat-interval: ${CREWSCOPE_RUNTIME_WORKER_HEARTBEAT_INTERVAL:10s}
        heartbeat-timeout: ${CREWSCOPE_RUNTIME_WORKER_HEARTBEAT_TIMEOUT:30s}
    scheduler:
      prepare-lease-duration: ${CREWSCOPE_RUNTIME_PREPARE_LEASE_DURATION:30s}
      run-lease-duration: ${CREWSCOPE_RUNTIME_RUN_LEASE_DURATION:30s}
      lease-heartbeat-interval: ${CREWSCOPE_RUNTIME_LEASE_HEARTBEAT_INTERVAL:10s}
      lease-heartbeat-jitter-tolerance: ${CREWSCOPE_RUNTIME_LEASE_HEARTBEAT_JITTER:5s}
      lease-sweeper-interval: ${CREWSCOPE_RUNTIME_LEASE_SWEEPER_INTERVAL:5s}
      team-concurrent-limit: ${CREWSCOPE_RUNTIME_TEAM_CONCURRENCY:8}
      runtime-concurrent-limit: ${CREWSCOPE_RUNTIME_CONCURRENCY:32}
      maximum-batch-size: ${CREWSCOPE_RUNTIME_CLAIM_BATCH_SIZE:8}
      maximum-scan-size: ${CREWSCOPE_RUNTIME_CLAIM_SCAN_SIZE:32}
      maximum-sweep-size: ${CREWSCOPE_RUNTIME_LEASE_SWEEP_SIZE:100}
    task-worker:
      model-id: ${CREWSCOPE_TASK_AGENT_MODEL_ID:crewscope-primary}
      fallback-model-id: ${CREWSCOPE_TASK_AGENT_FALLBACK_MODEL_ID:}
      system-prompt: ${CREWSCOPE_TASK_AGENT_SYSTEM_PROMPT:You are CrewScope's controlled Task Orchestrator. Follow the requested tool sequence exactly. Never retry a successful validation, never call fixture tools during planning, and execute only authorized fixture tools after a plan is approved.}
      max-iterations: ${CREWSCOPE_TASK_AGENT_MAX_ITERATIONS:20}
      max-retries: ${CREWSCOPE_TASK_AGENT_MAX_RETRIES:3}
      max-step-run-attempts: ${CREWSCOPE_TASK_STEP_MAX_ATTEMPTS:3}
      runtime-root: ${CREWSCOPE_TASK_AGENT_RUNTIME_ROOT:./var/crewscope/task-agent-runtime}
      poll-interval: ${CREWSCOPE_TASK_WORKER_POLL_INTERVAL:250ms}
      graceful-shutdown-timeout: ${CREWSCOPE_TASK_WORKER_SHUTDOWN_TIMEOUT:30s}
      task-token-lifetime: ${CREWSCOPE_TASK_TOKEN_LIFETIME:5m}
      recovery-candidate-limit: ${CREWSCOPE_TASK_SNAPSHOT_RECOVERY_LIMIT:16}
      maximum-reconcile-size: ${CREWSCOPE_TASK_WORKER_RECONCILE_SIZE:100}
    coding-specialist:
      model-id: ${CREWSCOPE_CODING_AGENT_MODEL_ID:crewscope-primary}
      fallback-model-id: ${CREWSCOPE_CODING_AGENT_FALLBACK_MODEL_ID:}
      compaction-model-id: ${CREWSCOPE_CODING_AGENT_COMPACTION_MODEL_ID:crewscope-primary}
      system-prompt: ${CREWSCOPE_CODING_AGENT_SYSTEM_PROMPT:You are CrewScope's controlled Coding Specialist. Load and follow the fixed coding skill. Maintain exactly two Todos named Implement requested change and Verify and deliver. Call todo_write only once to initialize both and once to complete both; never create or update intermediate Todos. Use only registered tools, run only required platform acceptance, inspect the final diff once and return the structured output immediately.}
      max-iterations: ${CREWSCOPE_CODING_AGENT_MAX_ITERATIONS:60}
      max-retries: ${CREWSCOPE_CODING_AGENT_MAX_RETRIES:3}
      temperature: ${CREWSCOPE_CODING_AGENT_TEMPERATURE:0}
      top-p: ${CREWSCOPE_CODING_AGENT_TOP_P:1}
      max-output-tokens: ${CREWSCOPE_CODING_AGENT_MAX_OUTPUT_TOKENS:8192}
      compaction-trigger-messages: ${CREWSCOPE_CODING_AGENT_COMPACTION_TRIGGER_MESSAGES:16}
      compaction-keep-messages: ${CREWSCOPE_CODING_AGENT_COMPACTION_KEEP_MESSAGES:4}
      tool-result-eviction-chars: ${CREWSCOPE_CODING_AGENT_EVICTION_CHARS:8192}
      tool-result-preview-chars: ${CREWSCOPE_CODING_AGENT_EVICTION_PREVIEW_CHARS:1024}
      runtime-root: ${CREWSCOPE_CODING_AGENT_RUNTIME_ROOT:./var/crewscope/coding-agent-runtime}
    personal-agent:
      model-id: ${CREWSCOPE_PERSONAL_AGENT_MODEL_ID:crewscope-primary}
      fallback-model-id: ${CREWSCOPE_PERSONAL_AGENT_FALLBACK_MODEL_ID:}
      system-prompt: ${CREWSCOPE_PERSONAL_AGENT_SYSTEM_PROMPT:You are the member's Personal Agent in CrewScope. Collaborate clearly and only use server-authorized tools and context.}
      max-iterations: ${CREWSCOPE_PERSONAL_AGENT_MAX_ITERATIONS:20}
      max-retries: ${CREWSCOPE_PERSONAL_AGENT_MAX_RETRIES:3}
      runtime-root: ${CREWSCOPE_PERSONAL_AGENT_RUNTIME_ROOT:./var/crewscope/agent-runtime}
    template-agent:
      # Exact TemplateVersion runtimes are short-lived; Session/State remain externally durable.
      maximum-iterations: ${CREWSCOPE_TEMPLATE_AGENT_MAXIMUM_ITERATIONS:40}
      runtime-root: ${CREWSCOPE_TEMPLATE_AGENT_RUNTIME_ROOT:./var/crewscope/template-agent-runtime}
    redis:
      # Agent state is a required M2 dependency; disable only in isolated non-runtime tests.
      enabled: ${CREWSCOPE_AGENT_STATE_REDIS_ENABLED:true}
      url: ${CREWSCOPE_REDIS_URL:redis://localhost:6379}
      environment: ${CREWSCOPE_ENVIRONMENT:development}
      instance-id: ${CREWSCOPE_AGENT_EXECUTION_INSTANCE_ID:}
      ownership-scope: ${CREWSCOPE_AGENT_EXECUTION_OWNERSHIP_SCOPE:default}
      ownership-lease: ${CREWSCOPE_AGENT_EXECUTION_OWNERSHIP_LEASE:30s}
      ownership-renewal: ${CREWSCOPE_AGENT_EXECUTION_OWNERSHIP_RENEWAL:5s}
      write-probe-ttl: ${CREWSCOPE_AGENT_STATE_WRITE_PROBE_TTL:10s}
