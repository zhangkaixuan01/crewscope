name: crewscope-team-beta

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crewscope
      POSTGRES_USER: crewscope
      POSTGRES_PASSWORD: ${CREWSCOPE_DB_PASSWORD:?run ./deploy/team-beta/quickstart.sh up first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U crewscope -d crewscope]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, yes]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: crewscope-backend:local
    pull_policy: never
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/team-beta/backend.Dockerfile
      args:
        MAVEN_IMAGE: ${CREWSCOPE_MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-17-alpine}
        RUNTIME_IMAGE: ${CREWSCOPE_JRE_IMAGE:-eclipse-temurin:17-jre-alpine}
    env_file:
      - ${CREWSCOPE_ENV_FILE:-./.runtime/.env}
    environment:
      SPRING_PROFILES_ACTIVE: team-beta
      CREWSCOPE_SERVER_PORT: 8080
      CREWSCOPE_ENVIRONMENT: ${CREWSCOPE_ENVIRONMENT:-team-beta}
      CREWSCOPE_DB_URL: jdbc:postgresql://postgres:5432/crewscope?currentSchema=crewscope,public
      CREWSCOPE_DB_USERNAME: crewscope
      CREWSCOPE_REDIS_URL: redis://redis:6379
      CREWSCOPE_BOOTSTRAP_USERNAME: crewscope-monitor
      CREWSCOPE_CREDENTIAL_CURRENT_KEY_ID: v1
      CREWSCOPE_DEMO_ORGANIZATION_NAME: ${CREWSCOPE_DEMO_ORGANIZATION_NAME:-CrewScope Team Beta}
      CREWSCOPE_OPERATOR_BOOTSTRAP_EMAIL: crewscope-monitor@crewscope.local
      CREWSCOPE_OPERATOR_BOOTSTRAP_DISPLAY_NAME: CrewScope Team Beta Operator
      CREWSCOPE_REGISTRATION_MODE: ${CREWSCOPE_REGISTRATION_MODE:-OPEN}
      CREWSCOPE_AGENT_EXECUTION_INSTANCE_ID: team-beta-api
      CREWSCOPE_AGENT_EXECUTION_OWNERSHIP_SCOPE: team-beta
      CREWSCOPE_AGENT_STATE_REDIS_ENABLED: "true"
      CREWSCOPE_TEAM_ACTIVITY_REALTIME_ENABLED: "true"
      CREWSCOPE_BROWSER_SESSION_ENABLED: "true"
      CREWSCOPE_SESSION_COOKIE_SECURE: ${CREWSCOPE_SESSION_COOKIE_SECURE:-false}
      CREWSCOPE_OPERATOR_BOOTSTRAP_ENABLED: "true"
      CREWSCOPE_FLYWAY_ENABLED: "true"
      CREWSCOPE_ARTIFACT_ROOT: /var/crewscope/artifacts
      CREWSCOPE_PERSONAL_AGENT_RUNTIME_ROOT: /var/crewscope/agent-runtime
      CREWSCOPE_TEMPLATE_AGENT_RUNTIME_ROOT: /var/crewscope/template-agent-runtime
      CREWSCOPE_TASK_AGENT_RUNTIME_ROOT: /var/crewscope/task-agent-runtime
      CREWSCOPE_CODING_AGENT_RUNTIME_ROOT: /var/crewscope/coding-agent-runtime
      CREWSCOPE_CODING_REPOSITORY_MANAGED_ROOT: ${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}/repositories
      CREWSCOPE_CODING_WORKTREE_ROOT: ${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}/worktrees
      CREWSCOPE_CODING_WORKTREE_LOCK_ROOT: ${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}/worktree-locks
      CREWSCOPE_GITHUB_MIRROR_ROOT: ${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}/github-mirrors
      CREWSCOPE_GITHUB_ASK_PASS_ROOT: /var/crewscope/github-credentials
      CREWSCOPE_CODING_GIT_COMMAND_HOME: /var/crewscope/git-home
      DOCKER_HOST: unix:///var/run/docker.sock
    group_add:
      - ${CREWSCOPE_DOCKER_GID:-0}
    volumes:
      - artifacts:/var/crewscope/artifacts
      - agent-runtime:/var/crewscope/agent-runtime
      - template-agent-runtime:/var/crewscope/template-agent-runtime
      - task-agent-runtime:/var/crewscope/task-agent-runtime
      - coding-agent-runtime:/var/crewscope/coding-agent-runtime
      # Sandbox containers need the same absolute repository/worktree paths as the API.
      - ${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}:${CREWSCOPE_EXECUTION_ROOT:?run quickstart.sh init}
      - ${CREWSCOPE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    image: crewscope-web:local
    pull_policy: never
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/team-beta/web.Dockerfile
      args:
        NODE_IMAGE: ${CREWSCOPE_NODE_IMAGE:-node:24-alpine}
        WEB_IMAGE: ${CREWSCOPE_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29-alpine}
    depends_on:
      api: {condition: service_healthy}
    ports:
      - 0.0.0.0:${CREWSCOPE_WEB_PORT:-8080}:8080
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  artifacts:
  agent-runtime:
  template-agent-runtime:
  task-agent-runtime:
  coding-agent-runtime:
