global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: crewscope-api
    metrics_path: /actuator/prometheus
    basic_auth:
      username: crewscope-prometheus
      password_file: /run/secrets/monitoring_password
    static_configs:
      - targets: [api:8080]

  - job_name: crewscope-worker
    metrics_path: /actuator/prometheus
    basic_auth:
      username: crewscope-prometheus
      password_file: /run/secrets/monitoring_password
    static_configs:
      - targets: [worker:8081]

  - job_name: crewscope-backup
    static_configs:
      - targets: [backup-metrics:9100]
