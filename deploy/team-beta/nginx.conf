map $http_x_forwarded_proto $crewscope_forwarded_proto {
    default $scheme;
    https https;
}

# Preserve a non-default public port for local/demo deployments. Incoming forwarding headers are
# still discarded below; the authoritative Host header is the one received by this Nginx hop.
map $http_host $crewscope_forwarded_host {
    "" $host;
    default $http_host;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # API responses, AG-UI and SSE stay on the same browser origin. Actuator is intentionally not
    # proxied, so metrics and health details remain on the internal deployment networks.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $crewscope_forwarded_host;
        proxy_set_header X-Forwarded-Host $crewscope_forwarded_host;
        # Preserve only an explicit HTTPS assertion from the loopback TLS terminator.
        proxy_set_header X-Forwarded-Proto $crewscope_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
